# =============================================================================
# Pegasus standalone launcher configuration
# Consumed by launch.py:  isaac_run PegasusSimulator/examples/launch.py
# Pass a different file with:  isaac_run .../launch.py --config /path/to/other.yaml
# =============================================================================

app:
  headless: false          # true = no GUI window (for headless SDG / servers)
  heartbeat_steps: 2000    # print a position heartbeat every N steps; 0 disables it

# --- World / environment -----------------------------------------------------
world:
  # Custom world USD. Absolute path, a file:// URL, or an omniverse:// URL.
  # If null, the named `preset` below is used instead.
  usd_path: null
  # One of the keys in pegasus.simulator.params.SIMULATION_ENVIRONMENTS
  # (e.g. "Curved Gridroom", "Flat Plane", "Warehouse", "Rusko Summer", ...).
  # Indoor: "Small Warehouse" (garage-like digital twin), "Simple Room", "Office",
  # "Hospital", "Warehouse" / "... with Forklifts/Shelves" / "Full Warehouse",
  # "Exhibition Hall".
  preset: "Small Warehouse"
  # Add a flat invisible ground collider at z=ground_z. Needed for render-only
  # worlds (e.g. NuRec volumes) that ship no collision mesh. false for normal USDs.
  add_ground_plane: false
  ground_z: 0.0

# --- Vehicle -----------------------------------------------------------------
vehicle:
  # Custom vehicle USD (the drone model). If null, the named `preset` is used.
  usd_path: null
  # One of the keys in pegasus.simulator.params.ROBOTS ("Iris" or "Pegasus").
  preset: "Iris"
  stage_prefix: "/World/quadrotor"
  vehicle_id: 1
  # Small Warehouse: room interior is x[-6.7,1.3] y[-7.2,9.8], ceiling 3.7 m.
  # (-5.3,-1) is the clear WEST aisle (shelving/boxes start at x=-4.6);
  # yaw 90 faces north along the aisle toward the open north zone.
  position: [ 0, 0, 0.15]        # ENU, metres
  orientation_euler_deg: [0.0, 0.0, 90.0]  # roll, pitch, yaw (XYZ)

  # --- On-board lidar (Isaac RTX lidar) ---------------------------------------
  # When enabled, a publish-only ROS2Backend is added automatically next to the
  # px4 flight backend, and the point cloud appears on ROS 2 as:
  #   /<ros2.namespace><vehicle_id>/<name>/pointcloud   (sensor_msgs/PointCloud2)
  #   /<ros2.namespace><vehicle_id>/<name>/laserscan    (sensor_msgs/LaserScan)
  # with frame_id = <name>. View it with rviz (block below).
  # One mapping or a list. NOTE: /laserscan only publishes for 2D lidar configs
  # (Isaac's flat-scan node rejects 3D ones), hence the extra 2D unit below.
  # `outputs` picks the ROS 2 topics per lidar: "pointcloud" and/or "laserscan".
  # laserscan only works with 2D configs (Isaac's flat-scan node rejects 3D),
  # so give each lidar exactly the output it exists for.
  lidar:
    - enabled: true
      name: "lidar"
      config: "Example_Rotary"       # 3D, +-15 deg elevation -> rich pointcloud
      outputs: ["pointcloud"]
      frequency: 10.0
      position: [0.0, 0.0, 0.10]     # body-frame FLU offset, metres
      orientation: [0.0, 0.0, 0.0]   # ZYX euler, degrees
    - enabled: false
      name: "lidar2d"
      config: "Example_Rotary_2D"    # single plane -> laserscan for 2D SLAM etc.
      outputs: ["laserscan"]
      frequency: 10.0
      position: [0.0, 0.0, 0.15]
      orientation: [0.0, 0.0, 0.0]

  # --- On-board FPV camera (drone POV) ----------------------------------------
  # Creates a camera prim on the drone body: pick "<name>" in the viewport camera
  # dropdown for the drone-POV view. Published to ROS 2 as:
  #   /<ns><id>/<name>/color/image_raw  (+ /color/camera_info; /depth if depth: true)
  # One mapping or a list, like lidar.
  camera:
    enabled: true
    name: "camera"
    resolution: [1280, 720]
    frequency: 20.0
    depth: false                     # true also publishes a depth image (costs GPU)
    position: [0.30, 0.0, 0.0]       # body-frame FLU: 30 cm forward of CG
    orientation: [0.0, 0.0, 180.0]   # ZYX euler deg (Pegasus default = forward, upright)

# --- Chase (follow) camera ---------------------------------------------------
# Script-driven third-person camera that tracks the vehicle every frame.
# (Isaac's PhysX follow cameras don't update in standalone apps, so we drive it.)
# NOTE: while active it cannot be mouse-orbited — the script overwrites its
# transform each frame. Switch the viewport dropdown back to "Perspective"
# whenever you want free camera control.
chase_camera:
  enabled: true
  stage_path: "/World/chase_camera"
  offset: [-3.0, 0.0, 1.2]   # body-frame FLU, metres: behind (-X) and above (+Z).
                             # Indoors keep |offset| under the nearest wall distance
                             # (z_max below handles the ceiling). ~[-10,0,3] outdoors.
  focal_length: 21           # mm; smaller = wider FOV (USD default 50 is narrow indoors)
  z_min: 0.3                 # camera height clamps (metres, world Z). Keeps the chase
  z_max: 3.35                # camera under the 3.7 m ceiling / off the floor no matter
                             # how high or low the drone flies. null = no clamp.
  yaw_follow: true           # true = offset rotates with drone yaw (stays behind);
                             # false = fixed world-frame offset (Gazebo-classic style)
  set_active: true           # switch the viewport to this camera at startup;
                             # false = camera exists but you pick it from the
                             # viewport camera dropdown when wanted
  follow_selection: true     # Gazebo-style object follow: while the viewport is on
                             # this camera, it follows the prim selected in the GUI
                             # (viewport or stage tree). Click empty sky / press Esc
                             # to deselect -> falls back to following the drone.
  smoothing: 0.15            # 0 = snap instantly; 0..0.95 = exponential glide per
                             # frame (softens the jump when re-targeting objects)

# --- Static viewpoint cameras --------------------------------------------------
# Fixed cameras created at startup; pick them from the viewport camera dropdown.
# position / look_at are world ENU metres; focal_length in mm (smaller = wider).
# Positions below are fitted to the Small Warehouse room:
#   interior x[-6.7,1.3] y[-7.2,9.8], ceiling 3.7 m, light bars at z=3.0,
#   shelving x[-4.6,1.2], clear west aisle at x=-5.3, open north zone y>5.5.
static_cameras:
  - name: overview_cam        # high SE corner: whole room diagonally (racks, aisle, office)
    position: [0.9, -6.8, 3.3]
    look_at: [-2.9, 1.5, 0.6]
    focal_length: 15
    set_perspective: true     # also park the editor Perspective camera here
  - name: aisle_cam           # north end of the west flight aisle, head-on at the drone
    position: [-5.4, 6.5, 2.4]
    look_at: [-5.3, -1.5, 0.5]
    focal_length: 18
  - name: top_cam             # bird's-eye map view over the room centre (north = up)
    position: [-2.7, 1.3, 3.5]
    look_at: [-2.7, 1.3, 0.0]
    focal_length: 14

# --- Control backend ---------------------------------------------------------
# NOTE: backend "px4" = PX4MavlinkBackend = the sim-internal MAVLink link that
# feeds PX4 SITL sensors and reads back motor commands. This is how the drone
# FLIES in sim; it is NOT MAVROS and must stay. ROS 2 topics come from the
# separate uxrce_dds block below (PX4 -> Micro XRCE-DDS Agent -> /fmu/... topics).
backend:
  type: "px4"                # "px4" | "ros2" | "none"

  px4:
    autolaunch: true         # let Pegasus start PX4 SITL for you
    px4_dir: null            # null -> use PegasusInterface default (configs.yaml)
    airframe: null           # null -> use PegasusInterface default; e.g. "iris" for PX4 < v1.14
    enable_lockstep: false   # false = PX4 free-runs on its own clock (data flows even if RTX render is slow);
                             # true = deterministic lockstep, but stalls if sim step rate is very low

  ros2:                      # used only when type == "ros2"
    namespace: "drone"
    pub_sensors: true
    pub_graphical_sensors: true
    pub_state: true
    pub_tf: false
    sub_control: false

# --- uXRCE-DDS (PX4 <-> ROS 2 bridge, replaces MAVROS) -----------------------
# PX4 (SITL in sim, or the real FC on hardware) runs a uxrce_dds_client that
# streams uORB topics to a Micro XRCE-DDS Agent, which exposes them to ROS 2 as
# /fmu/out/... and /fmu/in/... (via px4_msgs, version-matched to the firmware).
# PX4 SITL v1.14+ auto-starts its client on UDP 8888, so in sim you only need the
# agent running. Requires the Micro XRCE-DDS Agent installed and on PATH.
# Launched as a child process; killed on app exit.
uxrce_dds:
  enabled: true
  # Namespace for PX4's /fmu topics. null = auto: <backend.ros2.namespace><vehicle_id>
  # (same namespace as the Pegasus sensor topics, e.g. /drone1/fmu/out/...).
  # "" disables namespacing (plain /fmu/..., or /px4_N/fmu/... for instance N>0).
  namespace: null
  autostart_agent: true       # spawn MicroXRCEDDSAgent as a child process
  transport: "udp"            # "udp" (sim / PX4 SITL) | "serial" (hardware / Jetson UART)
  udp_port: 8888              # PX4 SITL uxrce_dds_client default; used when transport: udp
  serial_dev: "/dev/ttyTHS1"  # Jetson UART; used when transport: serial
  serial_baud: 921600
  agent_binary: "/home/ubuntu/.local/bin/MicroXRCEAgent"   # source-build binary is MicroXRCEAgent (NOT ...DDSAgent)
  # Override the whole argv (list) if your invocation differs; null = build from above.
  command: null

# --- RViz (external ROS 2 process) -------------------------------------------
# Runs with the HOST ROS 2 (auto-detected /opt/ros/*/setup.bash), not Isaac's.
rviz:
  enabled: true
  config: "/home/ubuntu/isaacsim/rviz_lidar.rviz"   # preset: lidar point cloud view
  ros_setup: null            # e.g. /opt/ros/humble/setup.bash; null = auto-detect
  # Drone pose -> TF bridge (host, pose_to_tf.py): mirrors the PoseStamped topic
  # as TF frame "drone_base_link", anchoring the drone to the world "map" frame.
  # NOTE: topic namespaces follow <backend.ros2.namespace><vehicle_id> ("drone1").
  pose_tfs:
    - topic: "/drone1/state/pose"
      child_frame: "drone_base_link"
  # Host static_transform_publishers ("x y z yaw pitch roll parent child"):
  # sensor mount frames hanging off the drone body (match vehicle sensor offsets).
  static_tfs:
    - "0 0 0.10 0 0 0 drone_base_link lidar"
    - "0 0 0.15 0 0 0 drone_base_link lidar2d"
    - "0.30 0 0 0 0 0 drone_base_link camera"
